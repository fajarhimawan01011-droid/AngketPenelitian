const app=document.getElementById("app"),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function plan(){let n=0;return DATA[role].secs.map(s=>s.q.map((q,i)=>{if(s.id)return"id"+(i+1);if(q.l&&/[b-z]$/.test(q.l))return q.l;n++;return q.l||String(n)}))}

async function post(d){const o={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)};let r;try{r=await fetch(CONFIG.endpoint,o)}catch(e){await fetch(CONFIG.endpoint,Object.assign({mode:"no-cors"},o));return true}return /^(ok|duplikat)/.test(await r.text())}
